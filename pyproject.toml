[project]
name = "clipper"
version = "0.1.0"
description = "Live stream clipper with automatic highlight detection from chat activity"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "streamlink>=6.0",
    "httpx>=0.27",
    "websockets>=13",
]

[project.optional-dependencies]
ai = ["anthropic>=2.11", "faster-whisper>=1.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
clipper = "clipper.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.setuptools.package-data]
clipper = ["static/*"]
