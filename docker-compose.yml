services:
  clipper:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      # Turns on the Claude check that keeps or rejects each auto clip.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLIPPER_BUFFER_SECONDS: "180"
      CLIPPER_HYPE_MULTIPLIER: "3"
      CLIPPER_WHISPER_MODEL: "base"
      # Posting (see README -> Posting to YouTube and TikTok)
      CLIPPER_PUBLIC_URL: ${CLIPPER_PUBLIC_URL:-http://localhost:8000}
      CLIPPER_YOUTUBE_CLIENT_ID: ${CLIPPER_YOUTUBE_CLIENT_ID:-}
      CLIPPER_YOUTUBE_CLIENT_SECRET: ${CLIPPER_YOUTUBE_CLIENT_SECRET:-}
      CLIPPER_TIKTOK_CLIENT_KEY: ${CLIPPER_TIKTOK_CLIENT_KEY:-}
      CLIPPER_TIKTOK_CLIENT_SECRET: ${CLIPPER_TIKTOK_CLIENT_SECRET:-}
    restart: unless-stopped
